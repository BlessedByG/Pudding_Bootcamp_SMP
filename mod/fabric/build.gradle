plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = rootProject.group
version = rootProject.version

base {
	archivesName = 'bootcamp'
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// De kernlogica: tegen compileren én meeleveren in de jar.
	implementation project(':core')
	include project(':core')

	// Tests draaien met de echte Minecraft-registries (zonder server), voor de item-parser.
	testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
