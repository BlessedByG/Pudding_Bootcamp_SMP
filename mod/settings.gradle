pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'bootcamp'

include 'core'

// Met -PcoreOnly bouw en test je alleen de kernlogica, zonder Loom en zonder Minecraft.
def coreOnly = providers.gradleProperty('coreOnly').map { it != 'false' }.getOrElse(false)
if (!coreOnly) {
	include 'fabric'
}
